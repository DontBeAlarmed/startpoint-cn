name: hygiene

on:
  push:
  pull_request:

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Validate documentation structure and links
        run: npm run docs:check

      - name: Validate contributor NPC nicknames
        run: node tools/npc_contributor_names.cjs

      - name: Test contributor NPC nickname validator
        run: node --test tools/npc_contributor_names.test.cjs

      - name: Hygiene scan (no personal IP / home path / personal email / .env / large binary)
        run: bash scripts/check-hygiene.sh --all

      - name: gitleaks (secret scan over history)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
