name: tests-quick

on:
  push:
  pull_request:

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 22.x 才支持 NODE_OPTIONS=--force-flushing（挂起诊断需要实时 TAP）
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # R-05 门禁收口：事务级回归（inventory/economy/gacha write transaction、
      # multi 生命周期、content 同步等 quick 组）此前只有本地 workflow 入口，
      # CI 从不运行。quick 组为 ts-node 直驱，无需先行 build。
      - name: Quick test groups
        env:
          # CI 双核跑不动本地校准的 30/60s 组预算——等比放大 5 倍；
          # 并行度压到 2，降低 ts-node 编译与内容安装的 CPU 争用
          TEST_TIMEOUT_SCALE: "5"
          TEST_MAX_PARALLEL: "2"
          # 子进程 stdout 走管道时块缓冲——挂起时 TAP 输出全丢，强制实时刷新以便诊断
          NODE_OPTIONS: "--force-flushing"
        run: npm run test:quick
