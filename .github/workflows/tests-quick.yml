name: tests-quick

on:
  push:
  pull_request:

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # R-05 门禁收口：事务级回归（inventory/economy/gacha write transaction、
      # multi 生命周期、content 同步等 quick 组）此前只有本地 workflow 入口，
      # CI 从不运行。quick 组为 ts-node 直驱，无需先行 build。
      - name: Quick test groups
        run: npm run test:quick
