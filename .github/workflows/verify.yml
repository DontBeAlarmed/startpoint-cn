name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (Node ${{ matrix.node }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - 20.19.0
          - 22.x
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:node
        env:
          WF_DATABASE_DIR: ${{ runner.temp }}\starpoint-node-test-db
      - run: npm audit --omit=dev --audit-level=high

  admin:
    name: Admin
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
        working-directory: admin
      - run: npm run typecheck
        working-directory: admin
      - run: npm run build
        working-directory: admin
      - run: npm audit --audit-level=high
        working-directory: admin

  tools:
    name: Python tools and launcher
    runs-on: windows-latest
    env:
      # 工具链全程中文输出;runner 控制台是 cp1252,不设 UTF-8 会 UnicodeEncodeError。
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      # 默认 TEMP 落在用户资料目录下且带 8.3 短名(RUNNER~1);tempfile 基于它
      # 建目录后,任何 Path.resolve() 都会展开成长路径,路径比较/relative_to
      # 全部失配。RUNNER_TEMP 没有短路径成分。
      - name: Point TEMP at the long-form runner temp dir
        run: |
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: mod-tools/requirements.txt
      - run: npm ci
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r mod-tools/requirements.txt
      - run: python -m unittest discover -s mod-tools/tests -p "test_*.py"
      - shell: powershell
        run: ./scripts/tests/test-start-cn.ps1
