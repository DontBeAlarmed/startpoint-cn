title = "starpoint-cn gitleaks config"

[extend]
useDefault = true

# 误报加白：游戏侧固定参数、游戏数据资源和 stub token，均非本仓库持有的密钥。
[allowlist]
description = "Non-secrets: game data assets and stub protocol values"
paths = [
    '''assets/.*\.json''',
    '''data/.*\.json''',
]
regexes = [
    '''whiteKey=[A-Za-z0-9_\-]+''',
    '''multi_access_token''',
]
